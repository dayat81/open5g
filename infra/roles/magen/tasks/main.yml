---
- name: Run the read-only preflight against the fixture
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-preflight.sh"
      - --env-file
      - "{{ magen_env_file }}"
      - "{{ '--gui-only' if magen_gui_only | bool else '--with-epc' }}"
      - --fixture-root
      - "{{ magen_fixture_root }}"
  changed_when: false
  check_mode: false
  when: magen_fixture_root | length > 0
  tags: [preflight]

- name: Run the read-only preflight on the host
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-preflight.sh"
      - --env-file
      - "{{ magen_env_file }}"
      - "{{ '--gui-only' if magen_gui_only | bool else '--with-epc' }}"
  changed_when: false
  check_mode: false
  when: magen_fixture_root | length == 0
  tags: [preflight]

- name: Check the generated magen compose
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/gen-android-ue.sh"
      - --target
      - magen
      - --check
  changed_when: false
  check_mode: false
  tags: [render]

- name: Bring the profile up
  ansible.builtin.command:
    argv: "{{ magen_up_argv }}"
  vars:
    magen_up_argv: >-
      {{
        ['bash', magen_repo + '/lab/scripts/magen-up.sh', '--env-file', magen_env_file]
        + (['--gui-only'] if magen_gui_only | bool else ['--with-epc'])
        + (['--with-sgi-egress'] if magen_sgi_egress | bool else [])
      }}
  environment:
    MAGEN_CHECK_MODE: "{{ '1' if ansible_check_mode else '0' }}"
  register: magen_up_result
  changed_when: "'changed=1' in magen_up_result.stdout"
  check_mode: false
  tags: [up]

- name: Back up the guest read-only
  ansible.builtin.command:
    argv: "{{ magen_backup_argv }}"
  vars:
    magen_backup_argv: >-
      {{
        ['bash', magen_repo + '/lab/scripts/magen-backup.sh']
        + (['--dry-run'] if ansible_check_mode else [])
      }}
  environment:
    MAGEN_GUEST_HOST: "{{ magen_guest_host }}"
    MAGEN_GUEST_KEY: "{{ magen_guest_key }}"
  changed_when: false
  check_mode: false
  tags: [never, backup]

- name: Restore dumps when requested
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-restore.sh"
      - --mongo-dump
      - "{{ magen_mongo_dump }}"
      - --pg-dump
      - "{{ magen_pg_dump }}"
  changed_when: false
  when: magen_mongo_dump is defined
  tags: [never, restore]

- name: Write the smoke report
  ansible.builtin.command:
    argv: "{{ magen_smoke_argv }}"
  vars:
    magen_smoke_argv: >-
      {{
        ['bash', magen_repo + '/lab/scripts/magen-smoke.sh', '--env-file', magen_env_file]
        + (['--gui-only'] if magen_gui_only | bool else ['--with-epc'])
        + ([] if magen_smoke_live | bool else ['--fixture'])
      }}
  changed_when: false
  tags: [never, smoke]

- name: Remove only o5g resources
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-down.sh"
      - --env-file
      - "{{ magen_env_file }}"
      - --dry-run
  changed_when: false
  when: ansible_check_mode
  tags: [never, down]

- name: Remove only o5g resources for real
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-down.sh"
      - --env-file
      - "{{ magen_env_file }}"
  register: magen_down_result
  changed_when: "'changed=1' in magen_down_result.stdout"
  when: not ansible_check_mode
  tags: [never, down]
