---
- name: Run the read-only preflight against the fixture
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-preflight.sh"
      - --env-file
      - "{{ magen_env_file }}"
      - --fixture-root
      - "{{ magen_fixture_root }}"
  changed_when: false
  check_mode: false
  when: magen_fixture_root | length > 0
  tags: [preflight]

- name: Run the read-only preflight on the host
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-preflight.sh"
      - --env-file
      - "{{ magen_env_file }}"
  changed_when: false
  check_mode: false
  when: magen_fixture_root | length == 0
  tags: [preflight]

- name: Record a read-only guest backup plan
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-backup.sh"
      - --dry-run
  changed_when: false
  environment:
    MAGEN_GUEST_HOST: "{{ magen_guest_host }}"
    MAGEN_GUEST_KEY: "{{ magen_guest_key }}"
  tags: [backup]

- name: Check the generated magen compose
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/gen-android-ue.sh"
      - --target
      - magen
      - --check
  changed_when: false
  check_mode: false
  tags: [render]

- name: Bring the profile up
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-up.sh"
      - --env-file
      - "{{ magen_env_file }}"
  environment:
    MAGEN_CHECK_MODE: "{{ '1' if ansible_check_mode else '0' }}"
  register: magen_up_result
  changed_when: "'changed=1' in magen_up_result.stdout"
  check_mode: false
  tags: [up]

- name: Restore dumps when requested
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-restore.sh"
      - --mongo-dump
      - "{{ magen_mongo_dump | default('/tmp/o5g-unset-mongo') }}"
      - --pg-dump
      - "{{ magen_pg_dump | default('/tmp/o5g-unset-pg') }}"
  environment:
    MAGEN_CHECK_MODE: "{{ '1' if ansible_check_mode else '0' }}"
  changed_when: false
  when: magen_mongo_dump is defined and not ansible_check_mode
  tags: [restore]

- name: Write the smoke report
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-smoke.sh"
      - --env-file
      - "{{ magen_env_file }}"
      - --fixture
  changed_when: false
  tags: [smoke]

- name: Remove only o5g resources
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-down.sh"
      - --dry-run
  changed_when: false
  when: ansible_check_mode
  tags: [down]

- name: Remove only o5g resources for real
  ansible.builtin.command:
    argv:
      - bash
      - "{{ magen_repo }}/lab/scripts/magen-down.sh"
  register: magen_down_result
  changed_when: "'changed=1' in magen_down_result.stdout"
  when: not ansible_check_mode
  tags: [down]
