---
- name: Install guest prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, iproute2, iptables, python3, uidmap]
    state: present
    update_cache: true
  when: not (iac_dry_run | bool)

- name: Create the lab directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0750'
  loop: ['{{ lab_root }}', '{{ lab_root }}/secrets', '{{ iac_render_dir }}']

- name: Load SCTP at boot
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/sctp.conf
    line: sctp
    create: true
    mode: '0644'
  when: not (iac_dry_run | bool)

- name: Load SCTP now
  community.general.modprobe:
    name: sctp
    state: present
  when: not (iac_dry_run | bool)

- name: Configure IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true
  when: not (iac_dry_run | bool)

- name: Ensure the tun device exists
  ansible.builtin.file:
    path: /dev/net/tun
    state: file
  when: not (iac_dry_run | bool)

- name: Install Docker Engine and Compose from distribution packages
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
  when: not (iac_dry_run | bool)
  # Supply packages through a local apt mirror on an isolated VM.

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: not iac_dry_run and vm_base_docker_service_enabled
