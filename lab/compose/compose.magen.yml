# Generated by lab/scripts/gen-magen.sh. Do not edit.
# androidN is emitted by emit_android in gen-android-ue.sh.
# Profile dashboard stays off until a PR #13 image digest is pinned.
# o5g-screen is internal and IPv4-only. Only the emulators and the screen
# listener join it. ws-scrcpy binds the emulator address on that network.
# The listener publishes 127.0.0.1:3301 and nothing else. Postgres is not published.
# The UPF uses a userspace TUN named ogstun. It does not load gtp or gtp5g.
# Default UPF stays on internal networks. o5g-egress is off until --with-sgi-egress.
# ueN is not on uemuN or o5g-screen. Phase B owns the gateway chains.
# This file does not set host ip_forward and does not name b0-agen-emu.

name: open5g

x-nf: &nf
  image: ${O5G_OPEN5GS_IMAGE:?O5G_OPEN5GS_IMAGE}
  restart: "no"
  cpus: ${O5G_NF_CPUS:?O5G_NF_CPUS}
  mem_limit: ${O5G_NF_MEM:?O5G_NF_MEM}
  volumes:
    - ${O5G_STATE_DIR:?O5G_STATE_DIR}/conf:/etc/o5:ro

services:
  mongo:
    image: ${O5G_MONGO_IMAGE:?O5G_MONGO_IMAGE}
    container_name: o5g-mongo
    restart: "no"
    cpus: ${O5G_MONGO_CPUS:?O5G_MONGO_CPUS}
    mem_limit: ${O5G_MONGO_MEM:?O5G_MONGO_MEM}
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    networks:
      mgmt:
        ipv4_address: ${O5G_MONGO_ADDR:?O5G_MONGO_ADDR}
    volumes:
      - o5g-mongo-data:/data/db

  hss:
    <<: *nf
    container_name: o5g-hss
    command: ["/opt/open5gs/bin/open5gs-hssd", "-c", "/etc/o5/hss.yaml"]
    networks:
      core:
        ipv4_address: ${O5G_HSS_CORE:?O5G_HSS_CORE}
      mgmt:
        ipv4_address: ${O5G_HSS_MGMT:?O5G_HSS_MGMT}
    depends_on: [mongo]

  pcrf:
    <<: *nf
    container_name: o5g-pcrf
    command: ["/opt/open5gs/bin/open5gs-pcrfd", "-c", "/etc/o5/pcrf.yaml"]
    networks:
      core:
        ipv4_address: ${O5G_PCRF_CORE:?O5G_PCRF_CORE}
      mgmt:
        ipv4_address: ${O5G_PCRF_MGMT:?O5G_PCRF_MGMT}
    depends_on: [mongo]

  mme:
    <<: *nf
    container_name: o5g-mme
    command: ["/opt/open5gs/bin/open5gs-mmed", "-c", "/etc/o5/mme.yaml"]
    networks:
      core:
        ipv4_address: ${O5G_MME_CORE:?O5G_MME_CORE}
      s1:
        ipv4_address: ${O5G_MME_S1:?O5G_MME_S1}

  sgwc:
    <<: *nf
    container_name: o5g-sgwc
    command: ["/opt/open5gs/bin/open5gs-sgwcd", "-c", "/etc/o5/sgwc.yaml"]
    networks:
      core:
        ipv4_address: ${O5G_SGWC_CORE:?O5G_SGWC_CORE}

  sgwu:
    <<: *nf
    container_name: o5g-sgwu
    command: ["/opt/open5gs/bin/open5gs-sgwud", "-c", "/etc/o5/sgwu.yaml"]
    networks:
      core:
        ipv4_address: ${O5G_SGWU_CORE:?O5G_SGWU_CORE}
      s1:
        ipv4_address: ${O5G_SGWU_S1:?O5G_SGWU_S1}

  smf:
    <<: *nf
    container_name: o5g-smf
    command: ["/opt/open5gs/bin/open5gs-smfd", "-c", "/etc/o5/smf.yaml"]
    networks:
      core:
        ipv4_address: ${O5G_SMF_CORE:?O5G_SMF_CORE}

  upf:
    <<: *nf
    container_name: o5g-upf
    user: root
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    entrypoint:
      - /bin/bash
      - -c
      - ip tuntap add name ogstun mode tun && ip addr add ${O5G_UE_TUN_CIDR:?O5G_UE_TUN_CIDR} dev ogstun && ip link set ogstun up && exec /opt/open5gs/bin/open5gs-upfd -c /etc/o5/upf.yaml
    networks:
      core:
        ipv4_address: ${O5G_UPF_CORE:?O5G_UPF_CORE}

  enb1:
    image: ${O5G_SRS_IMAGE:?O5G_SRS_IMAGE}
    container_name: o5g-enb1
    restart: "no"
    cpus: ${O5G_ENB_CPUS:?O5G_ENB_CPUS}
    mem_limit: ${O5G_ENB_MEM:?O5G_ENB_MEM}
    entrypoint: ["/bin/bash", "/opt/android-ue/android-ue-enb.sh"]
    command:
      - "--rf.device_name=zmq"
      - "--rf.device_args=fail_on_disconnect=true,tx_port0=tcp://*:2000,rx_port0=tcp://${O5G_UE1_UU:?O5G_UE1_UU}:2001,tx_port1=tcp://*:2100,rx_port1=tcp://${O5G_UE1_UU}:2101,id=enb,base_srate=${ZMQ_BASE_SRATE:?ZMQ_BASE_SRATE}"
    environment:
      UE_ADDRESS: ${O5G_UE1_UU}
      ANDROID_UE_ZMQ_WAIT: ${ANDROID_UE_ZMQ_WAIT:?ANDROID_UE_ZMQ_WAIT}
      ENB_ID: ${UE1_ENB_ID:?UE1_ENB_ID}
      MCC: ${MCC:?MCC}
      MNC: ${MNC:?MNC}
      TAC: ${TAC:?TAC}
      N_PRB: ${N_PRB:?N_PRB}
      TX_GAIN: ${TX_GAIN:?TX_GAIN}
      RX_GAIN: ${RX_GAIN:?RX_GAIN}
      MME_ADDR: ${O5G_MME_S1:?O5G_MME_S1}
      GTP_BIND_ADDR: ${O5G_ENB1_S1:?O5G_ENB1_S1}
      S1C_BIND_ADDR: ${O5G_ENB1_S1}
    volumes:
      - ../scripts/android-ue-enb.sh:/opt/android-ue/android-ue-enb.sh:ro
    networks:
      s1:
        ipv4_address: ${O5G_ENB1_S1}
      uu:
        ipv4_address: ${O5G_ENB1_UU:?O5G_ENB1_UU}
    depends_on:
      ue1:
        condition: service_started

  ue1:
    image: ${O5G_SRS_IMAGE}
    container_name: o5g-ue1
    restart: "no"
    cpus: ${O5G_UE_CPUS:?O5G_UE_CPUS}
    mem_limit: ${O5G_UE_MEM:?O5G_UE_MEM}
    cap_add: [NET_ADMIN]
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.eth0.disable_ipv6: "1"
    command:
      - ue
      - "--rf.device_name=zmq"
      - "--rf.device_args=tx_port0=tcp://${O5G_UE1_UU}:2001,rx_port0=tcp://${O5G_ENB1_UU}:2000,tx_port1=tcp://${O5G_UE1_UU}:2101,rx_port1=tcp://${O5G_ENB1_UU}:2100,id=ue,base_srate=${ZMQ_BASE_SRATE}"
    environment:
      UE_IMSI: ${UE1_IMSI:?UE1_IMSI}
      UE_KI: ${UE1_KI:?UE1_KI}
      UE_OPC: ${UE1_OPC:?UE1_OPC}
      UE_IMEI: ${UE1_IMEI:?UE1_IMEI}
      UE_ALGO: ${UE_ALGO:?UE_ALGO}
      UE_ADDRESS: ${O5G_UE1_UU}
      ENB_ADDRESS: ${O5G_ENB1_UU}
    volumes:
      - ../config/ran/android-ue.conf.template:/etc/srsran/ue.conf:ro
    networks:
      uu:
        ipv4_address: ${O5G_UE1_UU}

  enb2:
    image: ${O5G_SRS_IMAGE:?O5G_SRS_IMAGE}
    container_name: o5g-enb2
    restart: "no"
    cpus: ${O5G_ENB_CPUS:?O5G_ENB_CPUS}
    mem_limit: ${O5G_ENB_MEM:?O5G_ENB_MEM}
    entrypoint: ["/bin/bash", "/opt/android-ue/android-ue-enb.sh"]
    command:
      - "--rf.device_name=zmq"
      - "--rf.device_args=fail_on_disconnect=true,tx_port0=tcp://*:2000,rx_port0=tcp://${O5G_UE2_UU:?O5G_UE2_UU}:2001,tx_port1=tcp://*:2100,rx_port1=tcp://${O5G_UE2_UU}:2101,id=enb,base_srate=${ZMQ_BASE_SRATE:?ZMQ_BASE_SRATE}"
    environment:
      UE_ADDRESS: ${O5G_UE2_UU}
      ANDROID_UE_ZMQ_WAIT: ${ANDROID_UE_ZMQ_WAIT:?ANDROID_UE_ZMQ_WAIT}
      ENB_ID: ${UE2_ENB_ID:?UE2_ENB_ID}
      MCC: ${MCC:?MCC}
      MNC: ${MNC:?MNC}
      TAC: ${TAC:?TAC}
      N_PRB: ${N_PRB:?N_PRB}
      TX_GAIN: ${TX_GAIN:?TX_GAIN}
      RX_GAIN: ${RX_GAIN:?RX_GAIN}
      MME_ADDR: ${O5G_MME_S1:?O5G_MME_S1}
      GTP_BIND_ADDR: ${O5G_ENB2_S1:?O5G_ENB2_S1}
      S1C_BIND_ADDR: ${O5G_ENB2_S1}
    volumes:
      - ../scripts/android-ue-enb.sh:/opt/android-ue/android-ue-enb.sh:ro
    networks:
      s1:
        ipv4_address: ${O5G_ENB2_S1}
      uu:
        ipv4_address: ${O5G_ENB2_UU:?O5G_ENB2_UU}
    depends_on:
      ue2:
        condition: service_started

  ue2:
    image: ${O5G_SRS_IMAGE}
    container_name: o5g-ue2
    restart: "no"
    cpus: ${O5G_UE_CPUS:?O5G_UE_CPUS}
    mem_limit: ${O5G_UE_MEM:?O5G_UE_MEM}
    cap_add: [NET_ADMIN]
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.eth0.disable_ipv6: "1"
    command:
      - ue
      - "--rf.device_name=zmq"
      - "--rf.device_args=tx_port0=tcp://${O5G_UE2_UU}:2001,rx_port0=tcp://${O5G_ENB2_UU}:2000,tx_port1=tcp://${O5G_UE2_UU}:2101,rx_port1=tcp://${O5G_ENB2_UU}:2100,id=ue,base_srate=${ZMQ_BASE_SRATE}"
    environment:
      UE_IMSI: ${UE2_IMSI:?UE2_IMSI}
      UE_KI: ${UE2_KI:?UE2_KI}
      UE_OPC: ${UE2_OPC:?UE2_OPC}
      UE_IMEI: ${UE2_IMEI:?UE2_IMEI}
      UE_ALGO: ${UE_ALGO:?UE_ALGO}
      UE_ADDRESS: ${O5G_UE2_UU}
      ENB_ADDRESS: ${O5G_ENB2_UU}
    volumes:
      - ../config/ran/android-ue.conf.template:/etc/srsran/ue.conf:ro
    networks:
      uu:
        ipv4_address: ${O5G_UE2_UU}

  android1:
    image: ${O5G_ANDROID_IMAGE:?O5G_ANDROID_IMAGE}
    container_name: o5g-android1
    restart: "no"
    cpus: ${O5G_ANDROID_CPUS:?O5G_ANDROID_CPUS}
    mem_limit: ${O5G_ANDROID_MEM:?O5G_ANDROID_MEM}
    shm_size: "1gb"
    devices:
      - "/dev/kvm:/dev/kvm"
    group_add:
      - "${ANDROID_UE_KVM_GID:?ANDROID_UE_KVM_GID}"
    entrypoint: ["/bin/bash", "/opt/android-ue/magen-android-wait.sh"]
    sysctls:
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.eth0.disable_ipv6: "1"
      net.ipv6.conf.eth1.disable_ipv6: "1"
    environment:
      MEMORY: ${ANDROID_UE_MEMORY:?ANDROID_UE_MEMORY}
      CORES: ${ANDROID_UE_CORES:?ANDROID_UE_CORES}
      SKIP_AUTH: ${ANDROID_UE_SKIP_AUTH:?ANDROID_UE_SKIP_AUTH}
      DISABLE_ANIMATION: ${ANDROID_UE_DISABLE_ANIMATION:?ANDROID_UE_DISABLE_ANIMATION}
      EXTRA_FLAGS: "${ANDROID_UE_EXTRA_FLAGS:?ANDROID_UE_EXTRA_FLAGS}"
      BOOT_TIMEOUT: ${ANDROID_UE_BOOT_TIMEOUT:-600}
      ANDROID_UE_IPV6_MODE: "off"
      ANDROID_UE_ADB_MODE: standalone
      ANDROID_UE_SCREEN_BIND: ${O5G_SCREEN_ANDROID1:?O5G_SCREEN_ANDROID1}
      ANDROID_UE_SCREEN_PORT: "8000"
    volumes:
      - ../images/android-emulator/open5g-preflight.sh:/opt/open5g-preflight.sh:ro
      - ../scripts/magen-android-wait.sh:/opt/android-ue/magen-android-wait.sh:ro
    networks:
      uemu1:
        ipv4_address: ${ANDROID_UE_UEMU1_ANDROID:?ANDROID_UE_UEMU1_ANDROID}
      screen:
        ipv4_address: ${O5G_SCREEN_ANDROID1:?O5G_SCREEN_ANDROID1}

  android2:
    image: ${O5G_ANDROID_IMAGE:?O5G_ANDROID_IMAGE}
    container_name: o5g-android2
    restart: "no"
    cpus: ${O5G_ANDROID_CPUS:?O5G_ANDROID_CPUS}
    mem_limit: ${O5G_ANDROID_MEM:?O5G_ANDROID_MEM}
    shm_size: "1gb"
    devices:
      - "/dev/kvm:/dev/kvm"
    group_add:
      - "${ANDROID_UE_KVM_GID:?ANDROID_UE_KVM_GID}"
    entrypoint: ["/bin/bash", "/opt/android-ue/magen-android-wait.sh"]
    sysctls:
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.eth0.disable_ipv6: "1"
      net.ipv6.conf.eth1.disable_ipv6: "1"
    environment:
      MEMORY: ${ANDROID_UE_MEMORY:?ANDROID_UE_MEMORY}
      CORES: ${ANDROID_UE_CORES:?ANDROID_UE_CORES}
      SKIP_AUTH: ${ANDROID_UE_SKIP_AUTH:?ANDROID_UE_SKIP_AUTH}
      DISABLE_ANIMATION: ${ANDROID_UE_DISABLE_ANIMATION:?ANDROID_UE_DISABLE_ANIMATION}
      EXTRA_FLAGS: "${ANDROID_UE_EXTRA_FLAGS:?ANDROID_UE_EXTRA_FLAGS}"
      BOOT_TIMEOUT: ${ANDROID_UE_BOOT_TIMEOUT:-600}
      ANDROID_UE_IPV6_MODE: "off"
      ANDROID_UE_ADB_MODE: standalone
      ANDROID_UE_SCREEN_BIND: ${O5G_SCREEN_ANDROID2:?O5G_SCREEN_ANDROID2}
      ANDROID_UE_SCREEN_PORT: "8000"
    volumes:
      - ../images/android-emulator/open5g-preflight.sh:/opt/open5g-preflight.sh:ro
      - ../scripts/magen-android-wait.sh:/opt/android-ue/magen-android-wait.sh:ro
    networks:
      uemu2:
        ipv4_address: ${ANDROID_UE_UEMU2_ANDROID:?ANDROID_UE_UEMU2_ANDROID}
      screen:
        ipv4_address: ${O5G_SCREEN_ANDROID2:?O5G_SCREEN_ANDROID2}

  dashboard-postgres:
    profiles: ["dashboard"]
    image: ${O5G_POSTGRES_IMAGE:?O5G_POSTGRES_IMAGE}
    container_name: o5g-dashboard-postgres
    restart: "no"
    cpus: ${O5G_DASH_CPUS:?O5G_DASH_CPUS}
    mem_limit: ${O5G_DASH_MEM:?O5G_DASH_MEM}
    environment:
      POSTGRES_USER: ${O5G_POSTGRES_USER:?O5G_POSTGRES_USER}
      POSTGRES_PASSWORD: ${O5G_POSTGRES_PASSWORD:?O5G_POSTGRES_PASSWORD}
      POSTGRES_DB: ${O5G_POSTGRES_DB:?O5G_POSTGRES_DB}
    volumes:
      - o5g-dashboard-pg:/var/lib/postgresql/data
    networks:
      dash:
        ipv4_address: ${O5G_POSTGRES_ADDR:?O5G_POSTGRES_ADDR}

  dashboard-api:
    profiles: ["dashboard"]
    image: ${O5G_DASHBOARD_API_IMAGE:?O5G_DASHBOARD_API_IMAGE}
    container_name: o5g-dashboard-api
    restart: "no"
    cpus: ${O5G_DASH_CPUS}
    mem_limit: ${O5G_DASH_MEM}
    entrypoint: ["python", "-m", "open5g_dashboard"]
    environment:
      OPEN5G_DATABASE_URL: ${O5G_DATABASE_URL:?O5G_DATABASE_URL}
      OPEN5G_SESSION_PEPPER: ${O5G_SESSION_PEPPER:?O5G_SESSION_PEPPER}
      OPEN5G_MONGO_URI: ${O5G_MONGO_URI:?O5G_MONGO_URI}
      OPEN5G_BIND_HOST: ${O5G_API_DASH:?O5G_API_DASH}
      OPEN5G_BIND_PORT: "8000"
      OPEN5G_CORS_ORIGINS: http://127.0.0.1:3300
      OPEN5G_EMULATOR_ORIGINS: http://127.0.0.1:3300
    networks:
      dash:
        ipv4_address: ${O5G_API_DASH}
      mgmt:
        ipv4_address: ${O5G_API_MGMT:?O5G_API_MGMT}
    depends_on: [dashboard-postgres]

  dashboard-web:
    profiles: ["dashboard"]
    image: ${O5G_DASHBOARD_WEB_IMAGE:?O5G_DASHBOARD_WEB_IMAGE}
    container_name: o5g-dashboard-web
    restart: "no"
    cpus: ${O5G_DASH_CPUS}
    mem_limit: ${O5G_DASH_MEM}
    environment:
      OPEN5G_API_INTERNAL_URL: http://o5g-dashboard-api:8000
      WEB_PORT: "3300"
      PORT: "3300"
    ports:
      - "127.0.0.1:3300:3300"
    networks:
      dash:
        ipv4_address: ${O5G_WEB_DASH:?O5G_WEB_DASH}
    depends_on: [dashboard-api]

  dashboard-listener:
    profiles: ["dashboard"]
    image: ${O5G_DASHBOARD_API_IMAGE}
    container_name: o5g-dashboard-listener
    restart: "no"
    cpus: ${O5G_DASH_CPUS}
    mem_limit: ${O5G_DASH_MEM}
    entrypoint: ["python", "-m", "open5g_dashboard.screen"]
    environment:
      OPEN5G_DATABASE_URL: ${O5G_DATABASE_URL}
      OPEN5G_SESSION_PEPPER: ${O5G_SESSION_PEPPER}
      OPEN5G_EMULATOR_SCREEN_HOST: 127.0.0.1
      OPEN5G_EMULATOR_SCREEN_BIND_PORT: "3301"
      OPEN5G_EMULATOR_SCREEN_ORIGIN: http://localhost:3301
      OPEN5G_EMULATOR_ORIGINS: http://127.0.0.1:3300
      OPEN5G_EMULATOR_SCREEN_PORT: "8000"
      OPEN5G_EMULATOR_ALLOWED_NETS: ${O5G_SCREEN_SUBNET:?O5G_SCREEN_SUBNET}
      OPEN5G_EMULATOR_TARGETS: ue1=${O5G_SCREEN_ANDROID1:?O5G_SCREEN_ANDROID1}:8000,ue2=${O5G_SCREEN_ANDROID2:?O5G_SCREEN_ANDROID2}:8000
    ports:
      - "127.0.0.1:3301:3301"
    networks:
      dash: {}
      screen:
        ipv4_address: ${O5G_SCREEN_LISTENER:?O5G_SCREEN_LISTENER}
    depends_on: [dashboard-postgres, android1]

  screen1:
    profiles: ["dashboard"]
    image: ${O5G_SCREEN_IMAGE:?O5G_SCREEN_IMAGE}
    container_name: o5g-screen1
    restart: "no"
    cpus: ${O5G_DASH_CPUS}
    mem_limit: ${O5G_DASH_MEM}
    network_mode: "container:o5g-android1"
    entrypoint: ["/bin/sh", "/opt/android-ue/android-ue-screen.sh"]
    environment:
      ANDROID_UE_SCREEN_MODE: standalone
      ANDROID_UE_SCREEN_BIND: ${O5G_SCREEN_ANDROID1:?O5G_SCREEN_ANDROID1}
      ANDROID_UE_SCREEN_PORT: "8000"
      ANDROID_UE_SCREEN_PATH: /emulator/ue1
      ANDROID_ADB_SERVER_PORT: "5038"
    depends_on:
      android1:
        condition: service_started

  screen2:
    profiles: ["dashboard"]
    image: ${O5G_SCREEN_IMAGE}
    container_name: o5g-screen2
    restart: "no"
    cpus: ${O5G_DASH_CPUS}
    mem_limit: ${O5G_DASH_MEM}
    network_mode: "container:o5g-android2"
    entrypoint: ["/bin/sh", "/opt/android-ue/android-ue-screen.sh"]
    environment:
      ANDROID_UE_SCREEN_MODE: standalone
      ANDROID_UE_SCREEN_BIND: ${O5G_SCREEN_ANDROID2:?O5G_SCREEN_ANDROID2}
      ANDROID_UE_SCREEN_PORT: "8000"
      ANDROID_UE_SCREEN_PATH: /emulator/ue2
      ANDROID_ADB_SERVER_PORT: "5038"
    depends_on:
      android2:
        condition: service_started

networks:
  core:
    name: o5g-core
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${O5G_CORE_SUBNET:?O5G_CORE_SUBNET}
          gateway: ${O5G_CORE_GW:?O5G_CORE_GW}
  mgmt:
    name: o5g-mgmt
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${O5G_MGMT_SUBNET:?O5G_MGMT_SUBNET}
          gateway: ${O5G_MGMT_GW:?O5G_MGMT_GW}
  s1:
    name: o5g-s1
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${O5G_S1_SUBNET:?O5G_S1_SUBNET}
          gateway: ${O5G_S1_GW:?O5G_S1_GW}
  uu:
    name: o5g-uu
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${O5G_UU_SUBNET:?O5G_UU_SUBNET}
          gateway: ${O5G_UU_GW:?O5G_UU_GW}
  uemu1:
    name: o5g-uemu1
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${ANDROID_UE_UEMU1_SUBNET:?ANDROID_UE_UEMU1_SUBNET}
          gateway: ${ANDROID_UE_UEMU1_GW:?ANDROID_UE_UEMU1_GW}
  uemu2:
    name: o5g-uemu2
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${ANDROID_UE_UEMU2_SUBNET:?ANDROID_UE_UEMU2_SUBNET}
          gateway: ${ANDROID_UE_UEMU2_GW:?ANDROID_UE_UEMU2_GW}
  screen:
    name: o5g-screen
    internal: true
    enable_ipv6: false
    ipam:
      config:
