# Generated by lab/scripts/gen-android-ue.sh. Do not edit.
# The only androidN service. The overlay and the standalone wrapper include this
# file. ueN is not on uemuN in this phase. Phase B attaches it as the gateway.

services:
  android1:
    image: ${ANDROID_UE_ANDROID_IMAGE:-open5g-android-emulator:local}
    container_name: l5gd-android1
    restart: "no"
    profiles: ["android-ue", "android-standalone"]
    cpus: ${ANDROID_UE_CPU_LIMIT:-2.0}
    mem_limit: ${ANDROID_UE_MEM_LIMIT:-4096m}
    shm_size: "1gb"
    devices:
      - "/dev/kvm:/dev/kvm"
    group_add:
      - "${ANDROID_UE_KVM_GID:?ANDROID_UE_KVM_GID}"
    ports:
      - "127.0.0.1:15554:5554"
      - "127.0.0.1:15555:5555"
    environment:
      MEMORY: ${ANDROID_UE_MEMORY:?ANDROID_UE_MEMORY}
      CORES: ${ANDROID_UE_CORES:?ANDROID_UE_CORES}
      SKIP_AUTH: ${ANDROID_UE_SKIP_AUTH:?ANDROID_UE_SKIP_AUTH}
      DISABLE_ANIMATION: ${ANDROID_UE_DISABLE_ANIMATION:?ANDROID_UE_DISABLE_ANIMATION}
      EXTRA_FLAGS: "${ANDROID_UE_EXTRA_FLAGS:?ANDROID_UE_EXTRA_FLAGS}"
      BOOT_TIMEOUT: ${ANDROID_UE_BOOT_TIMEOUT:-600}
      ANDROID_UE_IPV6_ULA: ${ANDROID_UE_IPV6_ULA:-fdc2:fd97:24a4::1/128}
    networks:
      uemu1:
        ipv4_address: ${ANDROID_UE_UEMU1_ANDROID:?ANDROID_UE_UEMU1_ANDROID}

  android2:
    image: ${ANDROID_UE_ANDROID_IMAGE:-open5g-android-emulator:local}
    container_name: l5gd-android2
    restart: "no"
    profiles: ["android-ue", "android-standalone"]
    cpus: ${ANDROID_UE_CPU_LIMIT:-2.0}
    mem_limit: ${ANDROID_UE_MEM_LIMIT:-4096m}
    shm_size: "1gb"
    devices:
      - "/dev/kvm:/dev/kvm"
    group_add:
      - "${ANDROID_UE_KVM_GID:?ANDROID_UE_KVM_GID}"
    ports:
      - "127.0.0.1:16554:5554"
      - "127.0.0.1:16555:5555"
    environment:
      MEMORY: ${ANDROID_UE_MEMORY:?ANDROID_UE_MEMORY}
      CORES: ${ANDROID_UE_CORES:?ANDROID_UE_CORES}
      SKIP_AUTH: ${ANDROID_UE_SKIP_AUTH:?ANDROID_UE_SKIP_AUTH}
      DISABLE_ANIMATION: ${ANDROID_UE_DISABLE_ANIMATION:?ANDROID_UE_DISABLE_ANIMATION}
      EXTRA_FLAGS: "${ANDROID_UE_EXTRA_FLAGS:?ANDROID_UE_EXTRA_FLAGS}"
      BOOT_TIMEOUT: ${ANDROID_UE_BOOT_TIMEOUT:-600}
      ANDROID_UE_IPV6_ULA: ${ANDROID_UE_IPV6_ULA:-fdc2:fd97:24a4::1/128}
    networks:
      uemu2:
        ipv4_address: ${ANDROID_UE_UEMU2_ANDROID:?ANDROID_UE_UEMU2_ANDROID}

networks:
  uemu1:
    name: open5g-uemu1
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${ANDROID_UE_UEMU1_SUBNET:?ANDROID_UE_UEMU1_SUBNET}
          gateway: ${ANDROID_UE_UEMU1_GW:?ANDROID_UE_UEMU1_GW}

  uemu2:
    name: open5g-uemu2
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${ANDROID_UE_UEMU2_SUBNET:?ANDROID_UE_UEMU2_SUBNET}
          gateway: ${ANDROID_UE_UEMU2_GW:?ANDROID_UE_UEMU2_GW}

