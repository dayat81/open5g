name: dashboard

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: open5g_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open5g_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPEN5G_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/open5g_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r dashboard/backend/requirements.lock
      - run: pytest -rs
        working-directory: dashboard/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm test
        working-directory: dashboard/frontend
      - run: npm run lint
        working-directory: dashboard/frontend
      - run: npm run typecheck
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
